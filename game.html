<!-- game.html 의 상단 부분 수정 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Lost Island - 메인 게임</title>
    <!-- CSS 폴더 구조에 맞게 파일 연결 -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <div id="game-container">
        <!-- 기존 로직 동일 (헤더, 메인, 모달 등) -->    <div id="game-container">
        <!-- 상단: 날짜 및 스탯 -->
        <header>
            <h1 id="day-display">DAY 1</h1>
            <div id="stats-container">
                <p>❤️ 체력: <span id="stat-health">100</span></p>
                <p>🍖 배고픔: <span id="stat-hunger">100</span></p>
                <p>💧 갈증: <span id="stat-thirst">100</span></p>
                <p>🧠 정신력: <span id="stat-sanity">100</span></p>
                <p>🔥 체온: <span id="stat-temp">36.5</span>℃</p>
            </div>
            <hr>
        </header>

<div id="visual-area">
            <img id="bg-image" src="assets/bg/beach_day.png" alt="현재 배경">
            <img id="player-image" src="assets/characters/player_normal.png" alt="주인공 상태">
        </div>

        <!-- 중단: 자원 및 행동 버튼 -->
        <main>
            <div id="inventory">
                <h3>🎒 인벤토리</h3>
                <p>식량: <span id="inv-food">0</span> | 물: <span id="inv-water">0</span> | 나무: <span id="inv-wood">0</span></p>
            </div>
            <hr>
            <div id="action-buttons">
                <h3>🏃 행동 선택 (남은 행동: <span id="turn-left">2</span>번)</h3>
                <button onclick="GameEngine.performAction('식량 구하기')">식량 구하기</button>
                <button onclick="GameEngine.performAction('물 찾기')">물 찾기</button>
                <button onclick="GameEngine.performAction('휴식')">휴식 (체력 회복)</button>
            </div>
        </main>

        <!-- 이벤트 발생 시 띄울 모달창 -->
        <div id="event-modal" style="display: none;">
            <div class="modal-content">
                <h2 id="event-title">이벤트 제목</h2>
                <p id="event-desc">이벤트 설명</p>
                <div id="event-choices" style="margin-top: 20px;">
                    <!-- 선택지 버튼 추가 영역 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 자바스크립트 파일 연결 (순서가 매우 중요합니다!) -->
    <script src="js/state.js"></script>
    <script src="js/data/events.js"></script>
    <script src="js/systems/eventSystem.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    
    <!-- 게임 시작 트리거 -->
    <script src="js/main.js"></script>
</body>
</html>
